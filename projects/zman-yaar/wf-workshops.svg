x="122.1" y="629.8" font-size="2.5" text-anchor="start" fill="#000000"><tspan x="122.1" dy="0">שאלה שנייה</tspan></text><rect x="125.5" y="628.3" width="1.9" height="0.3" fill="#000000"/><rect x="126.6" y="627.5" width="1.9" height="0.3" fill="#000000"/><rect x="71.7" y="633.9" width="58.7" height="10.5" fill="#ffffff"/><text x="122.1" y="640.6" font-size="2.5" text-anchor="start" fill="#000000"><tspan x="122.1" dy="0">שאלה שלישית</tspan></text><rect x="125.5" y="639.1" width="1.9" height="0.3" fill="#000000"/><rect x="126.6" y="638.3" width="1.9" height="0.3" fill="#000000"/><rect x="71.7" y="644.6" width="58.7" height="10.5" fill="#ffffff"/><text x="122.1" y="651.3" font-size="2.5" text-anchor="start" fill="#000000"><tspan x="122.1" dy="0">שאלה רביעית</tspan></text><rect x="125.5" y="649.8" width="1.9" height="0.3" fill="#000000"/><rect x="126.6" y="649" width="1.9" height="0.3" fill="#000000"/><text x="101.1" y="687.9" font-size="5.3" text-anchor="middle" fill="#000000"><tspan x="101.1" dy="0">בואו נדבר, יהיה כיף!</tspan></text><line x1="147.2" y1="699.1" x2="172.8" y2="699.1" stroke="#000000" stroke-width="0.2"/><line x1="117.4" y1="699.1" x2="143" y2="699.1" stroke="#000000" stroke-width="0.2"/><line x1="87.6" y1="699.1" x2="113.2" y2="699.1" stroke="#000000" stroke-width="0.2"/><line x1="57.8" y1="699.1" x2="83.4" y2="699.1" stroke="#000000" stroke-width="0.2"/><text x="170.7" y="696.7" font-size="2.1" text-anchor="start" fill="#000000"><tspan x="170.7" dy="0">שם מלא</tspan></text><text x="140.7" y="696.7" font-size="2.1" text-anchor="start" fill="#000000"><tspan x="140.7" dy="0">טלפון</tspan></text><text x="111.7" y="696.7" font-size="2.1" text-anchor="start" fill="#000000"><tspan x="111.7" dy="0">אימייל</tspan></text><text x="81.6" y="696.7" font-size="2.1" text-anchor="start" fill="#000000"><tspan x="81.6" dy="0">הודעה</tspan></text><rect x="27.6" y="694.2" width="25.8" height="4.5" rx="2.3" fill="#000000"/><text x="40.5" y="697.6" font-size="2.1" text-anchor="middle" fill="#ffffff"><tspan x="40.5" dy="0">שליחה</tspan></text><rect x="21" y="103.5" width="78.9" height="48.2" fill="#d9d9d9"/><rect x="21" y="157.8" width="78.9" height="48.2" fill="#d9d9d9"/><rect x="21" y="212.1" width="78.9" height="48.2" fill="#d9d9d9"/><rect x="21" y="266.4" width="78.9" height="48.2" fill="#d9d9d9"/><rect x="102.1" y="103.5" width="78.8" height="48.2" fill="#d9d9d9"/><rect x="102.1" y="157.8" width="78.8" height="48.2" fill="#d9d9d9"/><rect x="102.1" y="212.1" width="78.8" height="48.2" fill="#d9d9d9"/><rect x="102.1" y="266.4" width="78.8" height="48.2" fill="#d9d9d9"/><rect x="90.9" y="56.5" width="20.1" height="6.4" rx="3.2" fill="#000000"/><text x="101" y="60.7" font-size="2.5" text-anchor="middle" fill="#ffffff"><tspan x="101" dy="0">ספר לי עוד ←</tspan></text><text x="101.2" y="95.4" font-size="5.3" text-anchor="middle" fill="#000000"><tspan x="101.2" dy="0">חלוקת סדנאות לפי גיל/נושא/משתנה וקבוע</tspan></text><g id="c"><text x="141.9" y="114.6" font-size="4.2" text-anchor="middle" fill="#000000">כותרת על סדנה</text><text x="141.6" y="120.3" font-size="2.5" text-anchor="middle" fill="#000000"><tspan x="141.6" dy="0">הסבר יותר מפורט על</tspan><tspan x="141.6" dy="3.1">הסדנה</tspan><tspan x="141.6" dy="3.1">למי זה מתאים?</tspan></text><rect x="129.6" y="139.5" width="24.1" height="6.4" rx="3.2" fill="#000000"/><text x="141.6" y="143.7" font-size="2.5" text-anchor="middle" fill="#ffffff">לפרטים נוספים ←</text></g><use href="#c" x="-81.1"/><use href="#c" y="54.3"/><use href="#c" x="-81.1" y="54.3"/><use href="#c" y="108.6"/><use href="#c" x="-81.1" y="108.6"/><use href="#c" y="162.9"/><use href="#c" x="-81.1" y="162.9"/><rect x="104.8" y="330.4" width="76.2" height="70.6" fill="#d9d9d9"/><text x="97.4" y="341.2" font-size="5.3" text-anchor="start" fill="#000000"><tspan x="97.4" dy="0">נעים מאוד</tspan><tspan x="97.4" dy="6.6">אני אורי ג’ייקובס</tspan></text><text x="97.2" y="356.8" font-size="2.5" text-anchor="start" fill="#000000"><tspan x="97.2" dy="0">מומחה להישרדות, עבודת ידיים וחיבור עמוק לטבע. אבל לפני</tspan><tspan x="97.2" dy="3.1">שהעברתי קורסים בטבע – הייתי בעצמי צריך ללמוד להאט.</tspan><tspan x="97.2" dy="6.2">אחרי שנים בעולם "הרגיל", משהו בפנים הרגיש ריק. רציתי יותר</tspan><tspan x="97.2" dy="3.1">חיבור, יותר שקט, יותר משמעות.</tspan><tspan x="97.2" dy="6.2">המסע שלי החזיר אותי לאדמה, לעבודה עם הידיים, לחיים פשוטים</tspan><tspan x="97.2" dy="3.1">ואמיתיים – ומאז אני מלווה אחרים בתהליך הזה.</tspan><tspan x="97.2" dy="6.2">במהלך השנים העברתי עשרות סדנאות, חוגים וקורסים – וראיתי איך</tspan><tspan x="97.2" dy="3.1">משהו קטן כמו הבערת אש או גילוף בעץ יכול לפתוח לב שלם.</tspan></text><text x="16.5" y="466.5" font-size="4.2" text-anchor="middle" fill="#2d2d2d">→</text><text x="16.5" y="556.3" font-size="4.2" text-anchor="middle" fill="#2d2d2d">→</text><text x="190.5" y="466.5" font-size="4.2" text-anchor="middle" fill="#2d2d2d">←</text><text x="190.5" y="556.3" font-size="4.2" text-anchor="middle" fill="#2d2d2d">←</text><rect x="21" y="438.3" width="51.9" height="52.9" fill="#d9d9d9"/><rect x="21" y="528.1" width="51.9" height="52.9" fill="#d9d9d9"/><rect x="75" y="438.3" width="52" height="52.9" fill="#d9d9d9"/><rect x="75" y="528.1" width="52" height="52.9" fill="#d9d9d9"/><rect x="129.1" y="438.3" width="51.9" height="52.9" fill="#d9d9d9"/><rect x="129.1" y="528.1" width="51.9" height="52.9" fill="#d9d9d9"/><text x="101" y="428.2" font-size="5.3" text-anchor="middle" fill="#000000">קבלו הצצה למה שיחכה לכם ביער</text><text x="101.4" y="517.9" font-size="5.3" text-anchor="middle" fill="#000000">זה מה שמספרים עליי</text></svg>
