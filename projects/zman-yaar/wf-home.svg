<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 850" font-family="Arial, sans-serif" direction="rtl"><rect x="0" y="0" width="202" height="850" fill="#ffffff"/><rect x="0.3" y="10.6" width="202" height="84.2" fill="#d9d9d9"/><rect x="181.3" y="2.8" width="5.3" height="5.3" fill="#d9d9d9"/><rect x="21.4" y="2.8" width="18" height="5.3" rx="2.6" fill="#d9d9d9"/><text x="125.2" y="6.2" font-size="2.1">סדנאות</text><text x="155.8" y="6.2" font-size="2.1">קורס ההישרדות השנתי</text><text x="170.3" y="6.2" font-size="2.1">בית</text><text x="101.6" y="42.6" font-size="6.7" text-anchor="middle"><tspan x="101.6">כותרת מקדימה</tspan><tspan x="101.6" dy="8.4">כותרת ראשית</tspan></text><text x="101.7" y="61" font-size="3.4" text-anchor="middle"><tspan x="101.7">כותרת משנית</tspan><tspan x="101.7" dy="4.3">פסקת הסבר/תיאור</tspan></text><rect x="89.8" y="78.1" width="23.1" height="6.4" rx="3.2"/><text x="101.3" y="82.3" font-size="2.5" text-anchor="middle" fill="#ffffff">הנעה לפעולה ←</text><rect x="28.1" y="105.3" width="65.4" height="48.7" fill="#d9d9d9"/><rect x="109.1" y="105.3" width="65.4" height="48.7" fill="#d9d9d9"/><rect x="124.8" y="143.1" width="34.1" height="6.4" rx="3.2"/><text x="141.8" y="147.3" font-size="2.5" text-anchor="middle" fill="#ffffff">לקורס ההישרדות השנתי ←</text><rect x="49.3" y="143.1" width="23.1" height="6.4" rx="3.2"/><text x="60.8" y="147.3" font-size="2.5" text-anchor="middle" fill="#ffffff">לכל הסדנאות ←</text><text x="142.8" y="124.5" font-size="4.2" text-anchor="middle">קורס ההישרדות השנתי</text><text x="101.4" y="175.2" font-size="4.2" text-anchor="middle">מה משתתפים מרוויחים כשהם מצטרפים אליי?</text><text x="60.8" y="122.4" font-size="4.2" text-anchor="middle"><tspan x="60.8">סדנאות מיומנויות</tspan><tspan x="60.8" dy="5.3">חיים קדומות</tspan></text><text x="142.7" y="129.9" font-size="2.5" text-anchor="middle">הסבר קצר על הקורס</text><text x="60.9" y="133.7" font-size="2.5" text-anchor="middle">הסבר קצר על הסדנאות</text><rect x="105.1" y="541.2" width="76.2" height="70.6" fill="#d9d9d9"/><rect x="0.3" y="275.5" width="202" height="79.5" fill="#d9d9d9"/><rect x="0.3" y="406.6" width="202" height="79.5" fill="#d9d9d9"/><text x="97.8" y="552.1" font-size="5.3"><tspan x="97.8">נעים מאוד</tspan><tspan x="97.8" dy="6.6">אני אורי ג’ייקובס</tspan></text><text x="101.6" y="293.2" font-size="5.3" text-anchor="middle">קורס ההישרדות השנתי</text><text x="101.6" y="424.3" font-size="5.3" text-anchor="middle">סדנאות</text><text x="101.8" y="265.7" font-size="4.2" text-anchor="middle">רוצים לשמוע טיפה יותר?</text><text x="97.6" y="567.6" font-size="2.5"><tspan x="97.6">מומחה להישרדות, עבודת ידיים וחיבור עמוק לטבע. אבל לפני</tspan><tspan x="97.6" dy="3.1">שהעברתי קורסים בטבע – הייתי בעצמי צריך ללמוד להאט.</tspan><tspan x="97.6" dy="3.1">אחרי שנים בעולם "הרגיל", משהו בפנים הרגיש ריק. רציתי יותר</tspan><tspan x="97.6" dy="3.1">חיבור, יותר שקט, יותר משמעות.</tspan><tspan x="97.6" dy="3.1">המסע שלי החזיר אותי לאדמה, לעבודה עם הידיים, לחיים פשוטים</tspan><tspan x="97.6" dy="3.1">ואמיתיים – ומאז אני מלווה אחרים בתהליך הזה.</tspan><tspan x="97.6" dy="3.1">במהלך השנים העברתי עשרות סדנאות, חוגים וקורסים – וראיתי איך</tspan><tspan x="97.6" dy="3.1">משהו קטן כמו הבערת אש או גילוף בעץ יכול לפתוח לב שלם.</tspan></text><rect x="0.3" y="226.3" width="202" height="15.8" fill="#d9d9d9"/><text x="101.6" y="235.3" font-size="2.5" text-anchor="middle">TRUST FACTORS</text><text x="101.6" y="214.8" font-size="2.5" text-anchor="middle"><tspan x="101.6" dy="7">כבר הספיקו להנות ולשרוד. מה איתכם?</tspan></text><text x="101.8" y="301.7" font-size="3.4" text-anchor="middle"><tspan x="101.8">הסבר יותר מפורט על</tspan><tspan x="101.8" dy="4.3">הקורס</tspan></text><text x="101.5" y="432.8" font-size="3.4" text-anchor="middle"><tspan x="101.5">הסבר יותר מפורט על</tspan><tspan x="101.5" dy="4.3">הסדנאות</tspan></text><rect x="84.3" y="326.3" width="34.1" height="6.4" rx="3.2"/><text x="101.3" y="330.5" font-size="2.5" text-anchor="middle" fill="#ffffff">לקורס ההישרדות השנתי ←</text><rect x="89.8" y="457.4" width="23.1" height="6.4" rx="3.2"/><text x="101.3" y="461.6" font-size="2.5" text-anchor="middle" fill="#ffffff">לכל הסדנאות ←</text><g fill="#6b6b6b"><rect x="21.4" y="340.6" width="51.9" height="48.2"/><rect x="21.4" y="471.7" width="51.9" height="48.2"/><rect x="75.3" y="340.6" width="51.9" height="48.2"/><rect x="75.3" y="471.7" width="51.9" height="48.2"/><rect x="129.3" y="340.6" width="51.9" height="48.2"/><rect x="129.3" y="471.7" width="51.9" height="48.2"/></g><g font-size="4.2" text-anchor="middle" fill="#2d2d2d"><text x="16.8" y="366.5">→</text><text x="16.8" y="497.6">→</text><text x="190.8" y="366.5">←</text><text x="190.8" y="497.6">←</text><text x="16.8" y="677.4">→</text><text x="16.8" y="767.1">→</text><text x="190.8" y="677.4">←</text><text x="190.8" y="767.1">←</text></g><g fill="#d9d9d9"><rect x="21.4" y="649.2" width="51.9" height="52.9"/><rect x="21.4" y="738.9" width="51.9" height="52.9"/><rect x="75.3" y="649.2" width="52" height="52.9"/><rect x="75.3" y="738.9" width="52" height="52.9"/><rect x="129.4" y="649.2" width="51.9" height="52.9"/><rect x="129.4" y="738.9" width="51.9" height="52.9"/></g><text x="101.4" y="639" font-size="5.3" text-anchor="middle">קבלו הצצה למה שיחכה לכם ביער</text><text x="101.7" y="728.8" font-size="5.3" text-anchor="middle">זה מה שמספרים עליי</text><g fill="#d9d9d9"><rect x="21.4" y="184.9" width="38.4" height="28.5"/><rect x="61.9" y="184.9" width="38.4" height="28.5"/><rect x="102.4" y="184.9" width="38.4" height="28.5"/><rect x="142.9" y="184.9" width="38.4" height="28.5"/></g><g font-size="2.5" text-anchor="middle"><text x="41.1" y="199.9">יתרונות</text><text x="81.6" y="199.9">יתרונות</text><text x="122.1" y="199.9">יתרונות</text><text x="162.6" y="199.9">יתרונות</text></g><text x="101.5" y="819" font-size="5.3" text-anchor="middle">בואו נדבר, יהיה כיף!</text><g stroke="#000" stroke-width="0.2"><line x1="147.6" y1="830.3" x2="173.2" y2="830.3"/><line x1="117.7" y1="830.3" x2="143.3" y2="830.3"/><line x1="87.9" y1="830.3" x2="113.5" y2="830.3"/><line x1="58.1" y1="830.3" x2="83.7" y2="830.3"/></g><g font-size="2.1"><text x="171" y="827.8">שם מלא</text><text x="141" y="827.8">טלפון</text><text x="112.1" y="827.8">אימייל</text><text x="82" y="827.8">הודעה</text></g><rect x="27.9" y="825.3" width="25.8" height="4.5" rx="2.3"/><text x="40.8" y="828.7" font-size="2.1" text-anchor="middle" fill="#ffffff">שליחה</text></svg>
