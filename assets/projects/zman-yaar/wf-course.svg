<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 1060" font-family="Arial, sans-serif" direction="rtl"><rect x="0" y="0" width="202" height="1060" fill="#ffffff"/><g fill="#d9d9d9"><rect x="0.2" y="10.6" width="202" height="65.2"/><rect x="113.6" y="104.5" width="67.5" height="65.2"/><rect x="113.6" y="246.3" width="67.5" height="65.2"/><rect x="113.6" y="391.5" width="67.5" height="65.2"/><rect x="21.2" y="173.7" width="67.5" height="65.2"/><rect x="21.2" y="315.6" width="67.5" height="65.2"/></g><g fill="#ffffff"><rect x="116.5" y="107.9" width="61.8" height="32.3"/><rect x="116.5" y="249.7" width="61.8" height="32.3"/><rect x="116.5" y="394.9" width="61.8" height="32.3"/><rect x="24.2" y="177.1" width="61.8" height="32.3"/><rect x="24.2" y="318.9" width="61.8" height="32.3"/></g><rect x="181.1" y="2.8" width="5.3" height="5.3" fill="#d9d9d9"/><rect x="21.2" y="2.8" width="18" height="5.3" rx="2.6" fill="#d9d9d9"/><g font-size="2.1"><text x="125.1" y="6.2">סדנאות</text><text x="155.6" y="6.2">קורס ההישרדות השנתי</text><text x="170.1" y="6.2">בית</text></g><text x="101.2" y="42.6" font-size="6.7" text-anchor="middle">קורס ההישרדות השנתי</text><g font-size="4.2" text-anchor="middle"><text x="147.4" y="149.2">חודש 1 - היכרות</text><text x="147.6" y="291">חודש 3 - התמודדות</text><text x="147.4" y="436.2">חודש 5 - סיום</text><text x="55.3" y="218.4">חודש 2 - עבודת ידיים</text><text x="55.4" y="360.3">חודש 4 - הישרדות</text></g><text x="101.4" y="95.6" font-size="5.3" text-anchor="middle">מה הקורס כולל?</text><text x="101.2" y="49.9" font-size="3.4" text-anchor="middle"><tspan x="101.2">קורס מקצועי - אבל גם מתנה</tspan><tspan x="101.2" dy="4.3">לעצמך</tspan></text><g font-size="2.5" text-anchor="middle" fill="#2d2d2d"><text x="147.6" y="155"><tspan x="147.6">הדלקת אש בשיטות מודרניות ובישול בטבע</tspan><tspan x="147.6" dy="3.1">הסוואה, התגנבות ומודעות מלאה לסביבה</tspan><tspan x="147.6" dy="3.1">גילוף פרקטי – מיומנויות בסיס בעבודה עם עץ</tspan><tspan x="147.6" dy="3.1">בניית מחסות – הגנה מהסביבה בטבע</tspan></text><text x="147.7" y="296.8"><tspan x="147.7">קליעה ומלכודות פרימיטיביות – ציד ולכידה</tspan><tspan x="147.7" dy="3.1">ליקוט בטבע – מזון ותרופות מהסביבה</tspan><tspan x="147.7" dy="3.1">גילוף בעץ – יצירה בעזרת אש ופלדה</tspan><tspan x="147.7" dy="3.1">הישרדות במדבר – יומיים בתנאים מדבריים</tspan></text><text x="147.8" y="442"><tspan x="147.8">אתגר הסיום – שגשוג בטבע</tspan><tspan x="147.8" dy="3.1">יומיים בטבע</tspan></text><text x="55.2" y="224.2"><tspan x="55.2">מסור, גרזן וסכין – בטיחות ועבודה עם כלים</tspan><tspan x="55.2" dy="3.1">אש פרימיטיבית – להדליק את הניצוץ הפנימי</tspan><tspan x="55.2" dy="3.1">סביב האש – בישול, אפייה ותרופות טבעיות</tspan><tspan x="55.2" dy="3.1">אתגר הישרדות חורפי – יומיים בשטח קר</tspan></text><text x="55.4" y="366"><tspan x="55.4">סיתות צור – כלי אבן פרימיטיביים</tspan><tspan x="55.4" dy="3.1">קליעה מחומרים טבעיים – סלסלות וכלים</tspan><tspan x="55.4" dy="3.1">מאדמה לכוס – ליקוט, עיבוד ועיצוב חרסית</tspan><tspan x="55.4" dy="3.1">ייבוש, עיטור ושריפה באש פתוחה</tspan></text><text x="16.7" y="574.7" font-size="4.2">→</text><text x="190.7" y="574.7" font-size="4.2">←</text></g><rect x="92.1" y="504.5" width="18.1" height="6.4" rx="3.2"/><text x="101.2" y="508.7" font-size="2.5" text-anchor="middle" fill="#ffffff">להרשמה ←</text><rect x="92.1" y="669" width="18.1" height="6.4" rx="3.2"/><text x="101.2" y="673.2" font-size="2.5" text-anchor="middle" fill="#ffffff">להרשמה ←</text><g fill="#d9d9d9"><rect x="100.1" y="126" width="2.1" height="312.1"/><rect x="41.9" y="469.1" width="38.4" height="28.5"/><rect x="21.2" y="546.5" width="51.9" height="52.9"/><rect x="82.4" y="469.1" width="38.4" height="28.5"/><rect x="75.2" y="546.5" width="52" height="52.9"/><rect x="123" y="469.1" width="38.4" height="28.5"/><rect x="129.3" y="546.5" width="51.9" height="52.9"/><rect x="0.2" y="615.2" width="101" height="46.8"/><rect x="105" y="693.7" width="76.2" height="70.6"/></g><rect x="101.2" y="615.2" width="101" height="46.8"/><g font-size="2.5" text-anchor="middle"><text x="142.3" y="484.1">תאריכים</text><text x="102" y="484.1">מחיר</text><text x="61.4" y="484.1">מיקום</text></g><text x="101.2" y="536.3" font-size="5.3" text-anchor="middle">קבלו הצצה למה שיחכה לכם ביער</text><text x="151.7" y="636.4" font-size="5.3" text-anchor="middle" fill="#ffffff">עם מה תצאו מהיער?</text><text x="151.7" y="642.7" font-size="2.5" text-anchor="middle" fill="#ffffff"><tspan x="151.7">לא רק ללמוד, אלא לגלות. לצאת מהשגרה אל תוך קצב</tspan><tspan x="151.7" dy="3.1">אחר. איטי יותר. טבעי יותר. כזה שמחבר אותנו למה</tspan><tspan x="151.7" dy="3.1">שבאמת חשוב.</tspan></text><text x="97.4" y="704.6" font-size="5.3"><tspan x="97.4">נעים להכיר,</tspan><tspan x="97.4" dy="6.6">אורי ג’ייקובס</tspan></text><text x="97.4" y="720.1" font-size="2.5"><tspan x="97.4">מומחה להישרדות, עבודת ידיים וחיבור עמוק לטבע. אבל לפני</tspan><tspan x="97.4" dy="3.1">שהעברתי קורסים בטבע – הייתי בעצמי צריך ללמוד להאט.</tspan><tspan x="97.4" dy="3.1">אחרי שנים בעולם "הרגיל", משהו בפנים הרגיש ריק. רציתי יותר</tspan><tspan x="97.4" dy="3.1">חיבור, יותר שקט, יותר משמעות.</tspan><tspan x="97.4" dy="3.1">המסע שלי החזיר אותי לאדמה, לעבודה עם הידיים, לחיים פשוטים</tspan><tspan x="97.4" dy="3.1">ואמיתיים – ומאז אני מלווה אחרים בתהליך הזה.</tspan><tspan x="97.4" dy="3.1">במהלך השנים העברתי עשרות סדנאות, חוגים וקורסים – וראיתי איך</tspan><tspan x="97.4" dy="3.1">משהו קטן כמו הבערת אש או גילוף בעץ יכול לפתוח לב שלם.</tspan></text><text x="101.5" y="790.4" font-size="5.3" text-anchor="middle">זה מה שמספרים עליי</text><defs><g id="t"><rect x="0" y="0" width="51.9" height="56" fill="#d9d9d9"/><path d="M27.9 4.2h17v14.3" stroke="#000" stroke-width=".3" fill="none"/><text x="47" y="26" font-size="4.2">שם, גיל, עיר</text><text x="47" y="31" font-size="2.5"><tspan x="47">כמה מילים טובות על החוויה,</tspan><tspan x="47" dy="3.1">על הקורס ועל הדרך שבה אורי</tspan><tspan x="47" dy="3.1">מחזיק את המרחב. משהו שנוגע</tspan><tspan x="47" dy="3.1">בלב ומשכנע להצטרף.</tspan></text></g></defs><use href="#t" x="129.3" y="800"/><use href="#t" x="75.2" y="800"/><use href="#t" x="21.2" y="800"/><use href="#t" x="129.3" y="862"/><use href="#t" x="75.2" y="862"/><use href="#t" x="21.2" y="862"/><text x="101.2" y="941.5" font-size="5.3" text-anchor="middle">שאלות ששאלו אותי</text><rect x="71.8" y="948.5" width="58.7" height="63.7" fill="#d9d9d9"/><rect x="71.8" y="948.5" width="58.7" height="23" fill="#ffffff"/><rect x="71.8" y="948.5" width="58.7" height="8.2" fill="#d9d9d9"/><text x="121.7" y="953.8" font-size="2.5">שאלה ראשונה</text><text x="121.7" y="960.9" font-size="2.1"><tspan x="121.7">תשובה ראשונה</tspan><tspan x="121.7" dy="2.6">של כמה שורות</tspan><tspan x="121.7" dy="2.6">אחת שתיים</tspan></text><g fill="#ffffff"><rect x="71.8" y="971.8" width="58.7" height="10.5"/><rect x="71.8" y="982.5" width="58.7" height="10.5"/><rect x="71.8" y="993.2" width="58.7" height="10.5"/><rect x="71.8" y="1004" width="58.7" height="10.5"/></g><g font-size="2.5"><text x="122.2" y="978.4">שאלה שנייה</text><text x="122.2" y="989.2">שאלה שלישית</text><text x="122.2" y="999.9">שאלה רביעית</text><text x="121.9" y="1010.6">שאלה חמישית</text></g><text x="101.3" y="1034" font-size="5.3" text-anchor="middle">בואו נדבר, יהיה כיף!</text><g stroke="#000" stroke-width="0.2"><line x1="147.4" y1="1047.7" x2="173" y2="1047.7"/><line x1="117.6" y1="1047.7" x2="143.2" y2="1047.7"/><line x1="87.8" y1="1047.7" x2="113.4" y2="1047.7"/><line x1="57.9" y1="1047.7" x2="83.5" y2="1047.7"/></g><g font-size="2.1"><text x="170.9" y="1045.3">שם מלא</text><text x="141" y="1045.3">טלפון</text><text x="111.9" y="1045.3">אימייל</text><text x="81.8" y="1045.3">הודעה</text></g><rect x="27.7" y="1042.8" width="25.8" height="4.5" rx="2.3"/><text x="40.6" y="1046.2" font-size="2.1" text-anchor="middle" fill="#ffffff">שליחה</text></svg>
